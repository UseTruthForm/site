name: Pages

# Every push to main publishes public/ to GitHub Pages. Pull requests run the
# checks only. Pages' own branch deploys can serve only the repo root or
# /docs, and either would publish the README; uploading public/ as an
# artifact serves that folder and nothing else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Core's main changes without any change here: a flag the docs name can
  # be renamed or removed there, and nothing on this side would notice
  # until the next site PR. The daily run checks the pages against core's
  # main as it is that day; it deploys nothing.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway: a cancelled deploy can
# leave Pages serving a mix of the old and new site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-pages.py
      # Every truthform command and flag on the site, against a binary built
      # from core's main: the site is meant to be true of main (see the
      # README). Core is public, so no token is needed to read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UseTruthForm/core
          ref: main
          path: core
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Build truthform from core's main
        working-directory: core
        run: |
          go build -o "$RUNNER_TEMP/truthform" ./cmd/truthform
          echo "core main at $(git rev-parse --short HEAD)"
      - run: python3 scripts/check-commands.py "$RUNNER_TEMP/truthform"

  deploy:
    # Not on pull requests, and not on the daily check either: that run is
    # about core's main moving, and a deploy then would only republish the
    # same site.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # A finished deploy says nothing about what visitors get: until the
      # custom domain and its DNS are in place, the address still serves the
      # registrar's parking page with a 200. Read the live site and fail if it
      # is not this commit's.
      - name: Check the live site
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
        run: python3 scripts/check-live.py "$URL" public
