<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">TruthForm</title>
  <!-- TruthForm's mascot, the same artwork as the GitHub org avatar: a hermit
       crab in a borrowed shell, which moves into a shell that already exists
       the way TruthForm takes infrastructure that already exists and turns it
       into code. Its claw holds the plumb bob that was the earlier logo.
       The avatar's colours are for a dark background; on a light one the
       pale shell all but vanishes, so light mode takes darker teals and the
       eyes get a coral rim (white on white would leave two floating pupils). -->
  <style>
    .cs { fill: #14b8a6; } .cw { stroke: #0f766e; } .cst { stroke: #14b8a6; }
    .sa { fill: #0f766e; } .sb { fill: #334155; }
    @media (prefers-color-scheme: dark) {
      .cs { fill: #5eead4; } .cw { stroke: #0f766e; } .cst { stroke: #5eead4; }
      .sa { fill: #5eead4; } .sb { fill: #cbd5e1; }
    }
  </style>
