<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">TruthForm</title>
  <!-- A letter T made of a beam and a plumb line: the beam, the string, a
       builder's plumb bob, and the mark on the ground its tip points at. A
       plumb line shows what is truly vertical, whatever the drawing says.
       The bob is slim, with flat machined faces and a separate cap and
       steel tip, and the beam has square ends, so that it reads as a tool
       at a glance; rounder versions did not. -->
  <style>
    .a { fill: #0f766e; }
    .b { fill: #334155; }
    @media (prefers-color-scheme: dark) {
      .a { fill: #5eead4; }
      .b { fill: #cbd5e1; }
    }
  </style>
  <g class="b"><rect x="8" y="5" width="48" height="6" rx="1.2"/><rect x="28.6" y="27" width="6.8" height="3.6" rx=".8"/><path d="M30.5 53.2H33.5L32.4 57.2Q32 58 31.6 57.2Z"/><rect x="24" y="59.6" width="16" height="2" rx="1"/></g>
  <g class="a"><rect x="31.1" y="11" width="1.8" height="16.5"/><path d="M27.5 31.8H36.5L39.8 35.6V39.4L33.6 52H30.4L24.2 39.4V35.6Z"/></g>
</svg>
