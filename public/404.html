<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Truthform</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- Root-absolute paths on purpose: this page is served for any missing
       URL, such as /docs/x/y, where a relative "styles.css" would resolve to
       /docs/x/styles.css and the page would render unstyled. -->
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <img class="brand-mark" src="/logo.svg" alt="" width="30" height="30">
        <span>Truthform</span>
      </a>
    </div>
  </header>
  <main id="main" class="wrap notfound">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>There is nothing at this address.</p>
    <p class="actions"><a class="btn btn-primary" href="/">Go to the home page</a> <a class="btn btn-ghost" href="/docs/">Read the docs</a></p>
  </main>
</body>
</html>
